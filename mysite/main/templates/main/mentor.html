{% extends 'main/base.html' %}
{% load static %}
{% block content %}


<!-- Icons Grid -->
<section class="features-icons bg-light text-center">
  <div class="container">
    <div class="row">
      <div class="container">
        <div id="carouselContent" class="carousel slide" data-ride="carousel">
          <div class="carousel-inner" role="listbox">
            <div class="carousel-item active text-center p-4">
              <p>
                멘토링을 원하는 분야를 선택하세요.
              </p>                
                
              <ul class="list-group left">
                {% for i in data %}
                <li class="list-group-item">
                  <div class="custom-control custom-radio custom-control-inline">
                    <form action="" method="post">
                      <input type="radio" class="custom-control-input" name="customRadio" id="i{{ forloop.counter }}" value="{{i.id}}">
                      <label class="custom-control-label" for="i{{forloop.counter}}">{{ i.question_text }}</label>
                     </form>
                  </div>
                </li>
                {% endfor %}
              </ul>
            </div>
            <div class="carousel-item text-center p-4">
              <p>
                원하는 멘토의 성별을 선택해주세요.
              </p>                
                <ul class="list-group left">
                    <li class="list-group-item">
                      <div class="custom-control custom-radio custom-control-inline">
                        <form action="" method="post">
                          <input type="radio" class="custom-control-input" name="customRadio" id="여자" value="여자">
                          <label class="custom-control-label" for="여자">여자</label>
                         </form>
                      </div>
                    </li>
                    <li class="list-group-item">
                      <div class="custom-control custom-radio custom-control-inline">
                        <form action="" method="post">
                          <input type="radio" class="custom-control-input" name="customRadio" id="남자" value="남자">
                          <label class="custom-control-label" for="남자">남자</label>
                         </form>
                      </div>
                    </li>
                    <li class="list-group-item">
                      <div class="custom-control custom-radio custom-control-inline">
                        <form action="" method="post">
                          <input type="radio" class="custom-control-input" name="customRadio" id="무관" value="무관">
                          <label class="custom-control-label" for="무관">무관</label>
                         </form>
                      </div>
                    </li>
                    
                </ul>
             </div>
            <div class="carousel-item text-center p-4">
              <p>
                 원하는 멘토의 전문분야를 선택해주세요. 
              </p>                
                              <ul class="list-group left">
                    <li class="list-group-item">
                      <div class="custom-control custom-radio custom-control-inline">
                        <form action="" method="post">
                          <input type="radio" class="custom-control-input" name="customRadio" id="인문" value="{{i.id}}">
                          <label class="custom-control-label" for="인문">인문</label>
                         </form>
                      </div>
                    </li>
                    <li class="list-group-item">
                      <div class="custom-control custom-radio custom-control-inline">
                        <form action="" method="post">
                          <input type="radio" class="custom-control-input" name="customRadio" id="자연" value="{{i.id}}">
                          <label class="custom-control-label" for="자연">자연</label>
                         </form>
                      </div>
                    </li>
                    <li class="list-group-item">
                      <div class="custom-control custom-radio custom-control-inline">
                        <form action="" method="post">
                          <input type="radio" class="custom-control-input" name="customRadio" id="예체능" value="{{i.id}}">
                          <label class="custom-control-label" for="예체능">예체능</label>
                         </form>
                      </div>
                    </li>
                     <li class="list-group-item">
                      <div class="custom-control custom-radio custom-control-inline">
                        <form action="" method="post">
                          <input type="radio" class="custom-control-input" name="customRadio" id="실업계" value="{{i.id}}">
                          <label class="custom-control-label" for="실업계">실업계</label>
                         </form>
                      </div>
                    </li>
                                  
                </ul>

            </div>
              
            <!--datepicker-->
            <div class="carousel-item text-center p-4">
              <p>
                 원하는 멘토링 날짜를 선택하세요.
              </p>                
                      
            </div>
              
            <div class="carousel-item text-center p-4">
                <button type="button" class="btn btn-success btn-lg" style="padding :1.5em 3em" onclick = "location.href = 'recommend' ">제출</button>
            </div>
              
          </div>
        </div>
        <div>  
          </div>
        <div class="button-wrapper">
          <a class="carousel-control-prev color" style="background:gold" href="#carouselContent" role="button" data-slide="prev">
            <button type="button" class="btn btn-primary step-btn color-white" onclick = "location.href = '#carouselContent' "> 이전 </button>
          </a>
          <a class="carousel-control-next color" style="background:gold" href="#carouselContent" role="button" data-slide="next">
            <button type="button" class="btn btn-primary step-btn color-teal"> 다음 </button>
          </a>
        </div>
      </div>
    </div>

  </div>
</section>

{% endblock content %}
